name: ✨ Feature Request
description: Suggest an idea or new feature for Echo
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a new feature or improvement for **Echo**!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem is.
      placeholder: "I'm always frustrated when..."
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear description of the new command, feature, or enhancement.
      placeholder: "Add a new command /feature that does..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Additional context or mockups
      description: Add any screenshots, Components V2 layout ideas, or extra notes.
